name: ❓ Question
description: Ask a question or seek clarification
title: "[Question] "
labels: ["question"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Have a question? Let's figure it out together! ❓

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: "What would you like to know?"
      placeholder: Ask your question in detail
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any relevant context (what you were trying to do, what you've tried so far)
      placeholder: |
        I was trying to...
        I've already tried...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: SoulForge Version
      description: "Version number (if known)"
    validations:
      required: false
