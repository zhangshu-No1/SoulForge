name: 🐛 Bug Report
description: Report something that isn't working as expected
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🐛

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
      placeholder: Describe what happened vs what you expected to happen
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the bug (1. Step one, 2. Step two...)
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: "Python version (e.g., 3.10, 3.11)"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: "Your OS (e.g., macOS, Windows, Linux)"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output / Error Messages
      description: Paste any relevant error messages or logs here
      placeholder: |
        Error traceback here...
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: Please confirm
      options:
        - label: I have searched the existing issues and this bug hasn't been reported yet
          required: true
