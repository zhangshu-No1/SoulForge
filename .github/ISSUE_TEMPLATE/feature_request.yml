name: 💡 Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Got a great idea? We'd love to hear it! 💡
        SoulForge is all about forging digital souls — tell us how we can make that experience better.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Pain Point
      description: "What problem does this feature solve? What's currently missing?"
      placeholder: Describe the problem or limitation
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this problem to be solved?
      placeholder: Describe your proposed feature in detail
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions you've considered?
    validations:
      required: false

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: "Who would benefit from this? What scenarios would this enable?"
      placeholder: |
        - As a [user type], I want to [goal] so that [benefit]
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the SoulForge Code of Conduct
          required: true
